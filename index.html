<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>EXPO2025 大阪・関西万博 みんなのアーカイブ（非公式）</title>
<style>
    @media screen and (min-width: 900px) {
        /* 960px以上に適用されるCSS（PC用） */
        .wrap{
            margin: 0 auto;
            padding-top: 50px;
        }
        h1{
            text-align: center;
            font-size: 26px;
        }
        p{
            text-align: center;
            font-size: 18px;
        }
        .time_info {
            text-align: center;
            margin:30px 0px 30px 0px;
        }
    }
    @media screen and (max-width: 899px) {
        /* 959px以下に適用されるCSS（タブレット用） */
        .wrap{
            margin: 0 auto;
            padding-top: 30px;
        }
        h1{
            text-align: center;
            font-size: 18px;
        }
        p{
            font-size: 16px;
        }
        .pre_info {
            text-align: center;
            margin:20px 40px 20px 40px;
        }
        .time_info {
            text-align: center;
            margin:30px 0px 30px 0px;
        }
        .post_info {
            text-align: left;
            margin:20px 40px 20px 40px;
        }
        .signature_info {
            text-align: center;
        }
    }
    @media screen and (max-width: 480px) {
        /* 480px以下に適用されるCSS（スマホ用） */
        .wrap{
            margin: 0 auto;
            padding-top: 30px;
        }
        h1{
            text-align: center;
            font-size: 18px;
        }
        p{
            font-size: 16px;
        }
        .pre_info {
            text-align: left;
            margin:20px 20px 20px 20px;
        }
        .time_info {
            text-align: center;
            margin:40px 0px 40px 0px;
        }
        .post_info {
            text-align: left;
            margin:20px 20px 20px 20px;
        }
        .signature_info {
            text-align: center;
        }
    }
</style>
</head>

<body>
    <div class="wrap">
        <div class="pre_info">
            <p>
                Comming soon...
            </p>
        </div>
    </div>
</body>
</html>
